name: Android CI

on:
  push:
    paths:
      - 'Android_APP/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android_APP/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint (Debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android_APP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('Android_APP/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('Android_APP/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Build debug APK & unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Run lint
        run: |
          ./gradlew --no-daemon lintDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Android_APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
